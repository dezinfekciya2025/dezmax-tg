<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DezMax CRM</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}
body{background:#f3f4f6;color:#1e293b;padding-bottom:60px}
.hide{display:none!important}
.box{max-width:460px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.head{background:#0f172a;color:#fff;padding:16px;border-radius:0 0 20px 20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.tab{background:rgba(255,255,255,.12);color:#e2e8f0;border:none;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap}
.tab.act{background:#4f46e5;color:#fff;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;margin-top:6px;background:#fff}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:#4f46e5;color:#fff;font-weight:600;font-size:14px;margin-top:10px}
.btn-g{background:#059669}
.btn-r{background:#fee2e2;color:#dc2626;padding:8px 12px;width:auto;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600;background:#e0e7ff;color:#4338ca}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:22px;font-weight:700;color:#4f46e5;margin-top:4px}
.sm{font-size:12px;color:#64748b}
</style>
</head>
<body>

<div id="scr-auth" class="box" style="padding-top:60px;text-align:center">
  <div id="st-load" class="card">Загрузка...</div>
  <div id="st-dir" class="card hide">
    <h3>🛡 Первый запуск CRM</h3>
    <p class="sm" style="margin:8px 0">Нажмите кнопку, чтобы стать Директором</p>
    <input id="in-dname" placeholder="Ваше имя" value="Директор">
    <button class="btn" onclick="regDir()">Войти как Директор</button>
  </div>
  <div id="st-no" class="card hide">
    <h3>🔒 Доступ закрыт</h3>
    <p class="sm" style="margin:8px 0">Отправьте этот ID директору:</p>
    <div id="my-id" style="font-size:20px;font-weight:700;padding:10px;background:#f1f5f9;border-radius:10px"></div>
  </div>
</div>

<div id="scr-app" class="hide">
  <div class="head">
    <div class="row">
      <div><b>DezMax CRM</b><div id="u-sub" class="sm" style="color:#94a3b8"></div></div>
      <span id="u-role" class="badge"></span>
    </div>
    <div id="nav" class="tabs"></div>
  </div>
  <div id="view" class="box"></div>
</div>

<script>
const U = 'https://' + 'ucjezypmyvhflzglvuab' + '.supabase.co' + '/rest/v1/';
const K = 'sb_publishable_87IwmGmHxwW_sLV4Wm1YYg_PkfcgfZa';
const H = {'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json','Prefer':'return=representation'};

const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
const myId = tg?.initDataUnsafe?.user?.id || 999999999;

let me=null, users=[], orders=[], cash=[], qr='', tab='home';

async function api(path, method='GET', body=null){
  const r = await fetch(U+path, {method, headers:H, body: body?JSON.stringify(body):null});
  return r.ok ? r.json() : [];
}

async function start(){
  try{
    users = await api('users?select=*');
    if(!users.length){
      document.getElementById('st-load').classList.add('hide');
      document.getElementById('st-dir').classList.remove('hide');
      return;
    }
    me = users.find(x => Number(x.tg_id) === Number(myId));
    if(!me){
      document.getElementById('st-load').classList.add('hide');
      document.getElementById('st-no').classList.remove('hide');
      document.getElementById('my-id').textContent = myId;
      return;
    }
    await reload();
  }catch(e){
    document.getElementById('st-load').textContent = 'Ошибка сети: ' + e.message;
  }
}

async function regDir(){
  const name = document.getElementById('in-dname').value || 'Директор';
  await api('users','POST',{tg_id:myId, name, role:'director', percent:100});
  location.reload();
}

async function reload(){
  [users, orders, cash] = await Promise.all([
    api('users?select=*'),
    api('orders?select=*&order=created_at.desc'),
    api('cash_handovers?select=*&order=created_at.desc')
  ]);
  const s = await api('settings?key=eq.kaspi_qr_url');
  qr = s[0]?.value || '';
  draw();
}

function go(t){ tab=t; reload(); }

function draw(){
  document.getElementById('scr-auth').classList.add('hide');
  document.getElementById('scr-app').classList.remove('hide');
  const isD = me.role === 'director';
  document.getElementById('u-sub').textContent = me.name + (isD ? '' : ` (${me.percent}%)`);
  document.getElementById('u-role').textContent = isD ? 'Директор' : 'Мастер';

  const list = isD
    ? [['home','Обзор'],['add','+ Заявка'],['orders','Все заявки'],['cash','Касса'],['masters','Мастера'],['qr','QR-код']]
    : [['home','Главная'],['orders','Заявки'],['reinf','Закрепительная'],['warr','Гарантия'],['cash','Касса'],['qr','QR-код']];

  document.getElementById('nav').innerHTML = list.map(([id,nm]) =>
    `<button class="tab ${tab===id?'act':''}" onclick="go('${id}')">${nm}</button>`
  ).join('');

  const v = document.getElementById('view');
  const myOrd = isD ? orders : orders.filter(o => Number(o.master_id) === Number(me.tg_id));

  if(tab==='home'){
    const act = myOrd.filter(o => o.status!=='completed');
    const done = myOrd.filter(o => o.status==='completed');
    v.innerHTML = `
      <div class="grid2">
        <div class="card"><div class="sm">В работе</div><div class="big">${act.length}</div></div>
        <div class="card"><div class="sm">Выполнено</div><div class="big" style="color:#059669">${done.length}</div></div>
      </div>
      ${act.map(oCard).join('') || '<div class="card sm" style="text-align:center">Активных заявок нет</div>'}
    `;
  }
  else if(tab==='add' && isD){
    const ms = users.filter(u => u.role==='master');
    v.innerHTML = `<div class="card">
      <h3>Новая заявка</h3>
      <input id="f-cl" placeholder="Имя клиента">
      <input id="f-ph" placeholder="Телефон">
      <input id="f-ad" placeholder="Адрес">
      <select id="f-ps"><option>Тараканы</option><option>Клопы</option><option>Грызуны</option><option>Клещи</option><option>Дезинфекция</option></select>
      <select id="f-tp"><option value="regular">Обычная</option><option value="reinforcement">Закрепительная</option><option value="warranty">Гарантия</option></select>
      <input id="f-pr" type="number" placeholder="Цена (₸)">
      <input id="f-dt" type="datetime-local">
      <select id="f-ms"><option value="">-- Выберите мастера --</option>${ms.map(m=>`<option value="${m.tg_id}">${m.name} (${m.percent}%)</option>`).join('')}</select>
      <textarea id="f-cm" placeholder="Примечание"></textarea>
      <button class="btn" onclick="addOrd()">Создать заявку</button>
    </div>`;
  }
  else if(['orders','reinf','warr'].includes(tab)){
    let arr = myOrd;
    if(tab==='reinf') arr = arr.filter(o=>o.order_type==='reinforcement');
    if(tab==='warr') arr = arr.filter(o=>o.order_type==='warranty');
    v.innerHTML = arr.map(oCard).join('') || '<div class="card sm" style="text-align:center">Пусто</div>';
  }
  else if(tab==='cash'){
    if(!isD){
      const rev = myOrd.filter(o=>o.status==='completed').reduce((s,o)=>s+Number(o.price||0),0);
      const sal = Math.round(rev * Number(me.percent)/100);
      const comp = rev - sal;
      const myH = cash.filter(c=>Number(c.master_id)===Number(me.tg_id));
      const handed = myH.filter(c=>c.status==='confirmed').reduce((s,c)=>s+Number(c.amount||0),0);
      v.innerHTML = `
        <div class="card" style="line-height:1.8;font-size:14px">
          <div class="row"><span class="sm">Выручка:</span><b>${rev} ₸</b></div>
          <div class="row"><span class="sm">Зарплата (${me.percent}%):</span><b style="color:#059669">${sal} ₸</b></div>
          <div class="row"><span class="sm">Доля компании:</span><b>${comp} ₸</b></div>
          <div class="row"><span class="sm">Сдано:</span><b>${handed} ₸</b></div>
          <hr style="margin:8px 0;border:0;border-top:1px solid #e2e8f0">
          <div class="row"><b>Остаток к сдаче:</b><b style="color:#4f46e5">${comp-handed} ₸</b></div>
        </div>
        <div class="card">
          <h4>Сдать деньги в кассу</h4>
          <input id="c-am" type="number" placeholder="Сумма (₸)">
          <input id="c-cm" placeholder="Комментарий">
          <button class="btn" onclick="sendCash()">Зафиксировать сдачу</button>
        </div>
        ${myH.map(c=>`<div class="card row"><div><b>${c.amount} ₸</b><div class="sm">${c.comment||''}</div></div><span class="badge">${c.status==='confirmed'?'Принято':'Проверка'}</span></div>`).join('')}
      `;
    } else {
      const rev = orders.filter(o=>o.status==='completed').reduce((s,o)=>s+Number(o.price||0),0);
      v.innerHTML = `
        <div class="card"><div class="sm">Общая выручка</div><div class="big" style="color:#059669">${rev} ₸</div></div>
        ${cash.map(c=>{
          const m = users.find(u=>Number(u.tg_id)===Number(c.master_id));
          return `<div class="card row"><div><b>${m?m.name:'Мастер'}: ${c.amount} ₸</b><div class="sm">${c.comment||''}</div></div>
          ${c.status==='pending'?`<button class="btn btn-g" style="width:auto;margin:0;padding:8px 12px" onclick="okCash('${c.id}')">Принять</button>`:'<span class="badge">Принято</span>'}</div>`;
        }).join('') || '<div class="card sm">Сдач пока нет</div>'}
      `;
    }
  }
  else if(tab==='masters' && isD){
    const ms = users.filter(u=>u.role==='master');
    v.innerHTML = `
      <div class="card">
        <h4>Добавить мастера</h4>
        <input id="m-id" type="number" placeholder="Telegram ID мастера">
        <input id="m-nm" placeholder="Имя мастера">
